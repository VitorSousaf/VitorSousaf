<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080d16"/>
      <stop offset="0.56" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#181426"/>
    </linearGradient>
    <linearGradient id="accent" x1="68" y1="0" x2="1115" y2="250" gradientUnits="userSpaceOnUse">

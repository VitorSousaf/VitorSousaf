<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101624"/>
      <stop offset="1" stop-color="#161229"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.88" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 95H1200M0 190H1200M0 285H1200"/>
    <path d="M120 0V380M300 0V380M480 0V380M660 0V380M840 0V380M1020 0V380M1140 0V380"/>
  </g>

  <!-- code brackets -->
  <text x="60" y="104" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="52" fill="url(#accent)" opacity="0.95">&lt;/&gt;</text>

  <!-- name -->
  <text x="82" y="184" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="#f0f6fc">VITOR SOUSA</text>

  <!-- subtitle -->
  <text x="84" y="232" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="23" font-weight="600" fill="#9dafc2">Full-Stack Engineer<tspan fill="#38bdf8"> · </tspan>React<tspan fill="#38bdf8"> · </tspan>Next.js<tspan fill="#38bdf8"> · </tspan>Node<tspan fill="#38bdf8"> · </tspan>React Native</text>

  <!-- tagline -->
  <text x="84" y="268" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="17" fill="#7d8ea3">I build products end-to-end and automate everything with AI.</text>

  <!-- pills -->
  <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="14" fill="#d7e2ee">
    <rect x="82" y="312" width="117" height="34" rx="17" fill="#141b26" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="98" y="334">TypeScript</text>
    <rect x="213" y="312" width="75" height="34" rx="17" fill="#141b26" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="229" y="334">React</text>
    <rect x="302" y="312" width="92" height="34" rx="17" fill="#141b26" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="318" y="334">Next.js</text>
    <rect x="408" y="312" width="92" height="34" rx="17" fill="#141b26" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="424" y="334">Node.js</text>
    <rect x="514" y="312" width="117" height="34" rx="17" fill="#141b26" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="530" y="334">PostgreSQL</text>
    <rect x="645" y="312" width="100" height="34" rx="17" fill="#141b26" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="661" y="334">AI · LLM</text>
  </g>

  <!-- location -->
  <text x="1120" y="352" text-anchor="end" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="13" fill="#5b6b80">Belém, PA · Brazil</text>
